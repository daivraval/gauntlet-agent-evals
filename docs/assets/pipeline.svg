<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="How GAUNTLET works, from scenario cards to the report card">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#566080"/>
    </marker>
  </defs>
  <style>
    .box { fill:#141a2a; stroke:#2a3350; stroke-width:1.5; rx:10; }
    .t { font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; font-weight:700; fill:#7dd3fc; }
    .b { font-family:'Segoe UI',system-ui,sans-serif; font-size:12.5px; fill:#8b93a7; }
    .lbl { font-family:'Segoe UI',system-ui,sans-serif; font-size:11.5px; fill:#566080; font-style:italic; }
    .arrow { stroke:#566080; stroke-width:1.6; fill:none; marker-end:url(#arr); }
  </style>

  <rect width="960" height="560" rx="18" fill="#0b0e14"/>

  <!-- row 1 -->
  <rect class="box" x="40" y="35" width="260" height="70" rx="10"/>
  <text class="t" x="60" y="60">50 scenario cards</text>
  <text class="b" x="60" y="80">plain YAML: the task on the front,</text>
  <text class="b" x="60" y="96">the answer key on the back</text>

  <line class="arrow" x1="302" y1="70" x2="346" y2="70"/>

  <rect class="box" x="350" y="35" width="230" height="70" rx="10"/>
  <text class="t" x="370" y="60">The runner</text>
  <text class="b" x="370" y="80">one fresh, isolated exam</text>
  <text class="b" x="370" y="96">per question card</text>

  <line class="arrow" x1="582" y1="70" x2="636" y2="70"/>

  <rect class="box" x="640" y="35" width="280" height="70" rx="10"/>
  <text class="t" x="660" y="60">The agent under test</text>
  <text class="b" x="660" y="80">any AI agent, plugged in</text>
  <text class="b" x="660" y="96">through one small adapter</text>

  <!-- agent uses the sandbox -->
  <line class="arrow" x1="690" y1="107" x2="424" y2="146" marker-start="url(#arr)"/>
  <text class="lbl" x="500" y="118">uses the tools</text>

  <!-- sandbox container -->
  <rect x="40" y="150" width="560" height="150" rx="12" fill="#10151f" stroke="#2a3350" stroke-width="1.5"/>
  <text x="60" y="176" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">The fake company &#183; a safe sandbox, nothing real can break</text>

  <rect class="box" x="60" y="192" width="160" height="88" rx="10"/>
  <text class="t" x="74" y="216" font-size="14">Mock shop</text>
  <text class="b" x="74" y="236">customers, orders,</text>
  <text class="b" x="74" y="252">prices, policies,</text>
  <text class="b" x="74" y="268">and a logbook</text>

  <rect class="box" x="240" y="192" width="160" height="88" rx="10"/>
  <text class="t" x="254" y="216" font-size="14">13 tools</text>
  <text class="b" x="254" y="236">look up, check stock,</text>
  <text class="b" x="254" y="252">email, refund,</text>
  <text class="b" x="254" y="268">calculate</text>

  <rect class="box" x="420" y="192" width="160" height="88" rx="10"/>
  <text x="434" y="216" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#c084fc">The saboteur</text>
  <text class="b" x="434" y="236">breaks tools on</text>
  <text class="b" x="434" y="252">purpose: errors,</text>
  <text class="b" x="434" y="268">timeouts, garbage</text>

  <!-- notebook -->
  <line class="arrow" x1="780" y1="107" x2="780" y2="196"/>
  <text class="lbl" x="792" y="156">every move recorded</text>

  <rect class="box" x="640" y="200" width="280" height="80" rx="10"/>
  <text class="t" x="660" y="226">The notebook (trajectory)</text>
  <text class="b" x="660" y="246">every step written down: tool calls,</text>
  <text class="b" x="660" y="262">errors, retries, the final answer</text>

  <!-- to graders -->
  <line class="arrow" x1="780" y1="282" x2="580" y2="338"/>
  <line class="arrow" x1="320" y1="302" x2="392" y2="338"/>
  <text class="lbl" x="180" y="326">the logbook is checked too</text>

  <rect class="box" x="270" y="340" width="420" height="84" rx="10"/>
  <text class="t" x="290" y="366">The 7 graders</text>
  <text class="b" x="290" y="386">six strict checklists in pure code, plus one</text>
  <text class="b" x="290" y="402">AI judge for the judgment calls only</text>

  <line class="arrow" x1="480" y1="426" x2="480" y2="464"/>

  <rect class="box" x="280" y="468" width="400" height="62" rx="10"/>
  <text x="300" y="492" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#34d399">The report card</text>
  <text class="b" x="300" y="512">terminal scorecard &#183; web report &#183; pass or fail gate for CI</text>
</svg>
