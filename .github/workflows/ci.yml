name: gauntlet-ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (graders, faults, world, loader)
        run: pytest -q
      - name: Offline pipeline smoke — full 50-scenario run, scripted agent
        run: python run_evals.py run --agent scripted --no-judge --quiet --fail-under 0.75
